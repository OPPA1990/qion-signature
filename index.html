document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"530ec36e-6d83-4db7-a4db-2def0c1d5f43\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@font-face{font-family:Aeonik;src:url(\"c3e27759-a610-4d63-bf2c-92441c7de772\") format(\"opentype\");font-weight:400}\n@font-face{font-family:Aeonik;src:url(\"66229c56-ef15-4ce0-885e-ca3adcbe85d4\") format(\"opentype\");font-weight:500}\n@font-face{font-family:Aeonik;src:url(\"3d915ee6-c358-4c2a-9e9e-fd3ae7a07bb2\") format(\"opentype\");font-weight:700}\n@font-face{font-family:Aeonik;src:url(\"ef3d0ee1-e327-4393-aa9e-7f28f11e3606\") format(\"opentype\");font-weight:900}\nhtml,body{margin:0;background:#000;color:#fff;font-family:Aeonik,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#27a8e0;text-decoration:none}a:hover{color:#fff;text-decoration:underline;text-decoration-color:#27a8e0}\ninput,select,button{font-family:inherit}\n::selection{background:#27a8e0;color:#000}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;position:relative;padding:40px clamp(24px,5vw,72px) 96px clamp(40px,6vw,96px);box-sizing:border-box;display:flex;flex-direction:column;gap:56px\">\n  <div style=\"position:absolute;left:clamp(16px,2.5vw,48px);top:0;bottom:0;width:4px;background:#27a8e0\"><\u002Fdiv>\n\n  <header style=\"display:flex;flex-direction:column;gap:28px;max-width:1120px\">\n    <img src=\"74c63900-0082-43a4-adf9-c0821d5a0649\" alt=\"QiOn\" style=\"height:32px;width:auto;display:block;align-self:flex-start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)\">Email signature<\u002Fdiv>\n      <h1 style=\"margin:0;font-size:clamp(36px,5vw,60px);font-weight:900;line-height:1;letter-spacing:-.03em;text-wrap:pretty\">Your QiOn signature <span style=\"color:#27a8e0\">in four steps.<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;font-size:19px;line-height:1.5;color:rgba(255,255,255,.78);max-width:640px;text-wrap:pretty\">It takes about five minutes. Keep this page open while you follow the steps.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ missingAssets }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;border:1px solid rgba(39,168,224,.5);padding:14px 18px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.85)\"><strong style=\"color:#27a8e0;font-weight:700\">Missing hosted images:<\u002Fstrong> {{ missingList }}. Please tell luismiguel.p@qiontech.com before copying.<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px;max-width:1120px;align-items:start\">\n    <section style=\"display:flex;flex-direction:column;gap:22px;max-width:480px\">\n      <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:999px;background:#27a8e0;color:#000;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">1<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:-.01em\">Type your details<\u002Fspan><\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:16px;font-weight:500;color:rgba(255,255,255,.85)\">Full name<\u002Fspan>\n        <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"e.g. Alessandra Rinaldi\" style=\"height:52px;padding:0 16px;background:#0d0d0d;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:#fff;font-size:17px;outline:none\" style-focus=\"border-color:#27a8e0\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:16px;font-weight:500;color:rgba(255,255,255,.85)\">Position<\u002Fspan>\n        <input value=\"{{ role }}\" sc-camel-on-change=\"{{ onRole }}\" placeholder=\"e.g. Head of Grid Solutions\" style=\"height:52px;padding:0 16px;background:#0d0d0d;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:#fff;font-size:17px;outline:none\" style-focus=\"border-color:#27a8e0\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:16px;font-weight:500;color:rgba(255,255,255,.85)\">Team <span style=\"color:rgba(255,255,255,.55);font-weight:400\">(you can leave this empty)<\u002Fspan><\u002Fspan>\n        <input value=\"{{ team }}\" sc-camel-on-change=\"{{ onTeam }}\" placeholder=\"e.g. BESS &amp; EMS\" style=\"height:52px;padding:0 16px;background:#0d0d0d;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:#fff;font-size:17px;outline:none\" style-focus=\"border-color:#27a8e0\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:16px;font-weight:500;color:rgba(255,255,255,.85)\">Work email<\u002Fspan>\n        <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"e.g. name.surname@qiontech.com\" type=\"email\" style=\"height:52px;padding:0 16px;background:#0d0d0d;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:#fff;font-size:17px;outline:none\" style-focus=\"border-color:#27a8e0\">\n        <sc-if value=\"{{ emailWarn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:15px;color:#27a8e0\">Please use your @qiontech.com address.<\u002Fspan><\u002Fsc-if>\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:16px;font-weight:500;color:rgba(255,255,255,.85)\">Office <span style=\"color:rgba(255,255,255,.55);font-weight:400\">(you can leave this empty)<\u002Fspan><\u002Fspan>\n        <sc-raw-select ref=\"{{ officeRef }}\" value=\"{{ office }}\" sc-camel-on-change=\"{{ onOffice }}\" style=\"height:52px;padding:0 12px;background:#0d0d0d;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:#fff;font-size:17px;outline:none\"><option value=\"No office line\">No office line<\u002Foption><option value=\"HQ · Boston, USA\">HQ · Boston, USA<\u002Foption><option value=\"Europe HQ · Reggio Emilia, Italy\">Europe HQ · Reggio Emilia, Italy<\u002Foption><option value=\"Latam HQ · Puebla, Mexico\">Latam HQ · Puebla, Mexico<\u002Foption><option value=\"Oceania HQ · Sydney, Australia\">Oceania HQ · Sydney, Australia<\u002Foption><option value=\"Asia–Middle East HQ · Dubai, UAE\">Asia–Middle East HQ · Dubai, UAE<\u002Foption><option value=\"Financial HQ · Lugano, Switzerland\">Financial HQ · Lugano, Switzerland<\u002Foption><option value=\"Other…\">Other…<\u002Foption><\u002Fsc-raw-select>\n      <\u002Flabel>\n      <sc-if value=\"{{ isCustomOffice }}\" hint-placeholder-val=\"{{ false }}\">\n        <input value=\"{{ customOffice }}\" sc-camel-on-change=\"{{ onCustomOffice }}\" placeholder=\"e.g. Sales Office · Madrid, Spain\" style=\"height:52px;padding:0 16px;background:#0d0d0d;border:1px solid rgba(255,255,255,.22);border-radius:2px;color:#fff;font-size:17px;outline:none\" style-focus=\"border-color:#27a8e0\">\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:22px;min-width:0\">\n      <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:999px;background:#27a8e0;color:#000;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">2<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:-.01em\">Check it and copy it<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#fff;color:#000;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column\">\n        <div style=\"padding:24px 20px 28px;display:flex;flex-direction:column;gap:18px;overflow-x:auto\">\n          <div style=\"font-size:15px;line-height:1.5;color:rgba(0,0,0,.72)\">Best regards,<\u002Fdiv>\n          <div ref=\"{{ previewRef }}\" style=\"min-height:200px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ copyRich }}\" disabled=\"{{ notReady }}\" style=\"height:64px;width:100%;background:#27a8e0;color:#000;border:none;border-radius:999px;font-size:19px;font-weight:700;letter-spacing:.01em;opacity:{{ btnOpacity }};cursor:{{ btnCursor }}\" style-hover=\"background:#1f8fc0\" style-active=\"transform:scale(.98)\">Copy signature<\u002Fbutton>\n      <div style=\"font-size:16px;line-height:1.5;color:#27a8e0;min-height:24px;font-weight:500\">{{ statusText }}<\u002Fdiv>\n\n      <div style=\"border-top:1px solid rgba(255,255,255,.1);padding-top:16px;display:flex;flex-direction:column;gap:14px\">\n        <button sc-camel-on-click=\"{{ toggleMore }}\" style=\"align-self:flex-start;background:none;border:none;padding:0;color:rgba(255,255,255,.72);font-size:15px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center\" style-hover=\"color:#fff\"><span style=\"color:#27a8e0\">{{ moreIcon }}<\u002Fspan> Other options <span style=\"color:rgba(255,255,255,.5);font-weight:400\">(only if your instructions ask for them)<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ showMore }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ copyPlain }}\" disabled=\"{{ notReady }}\" style=\"height:46px;min-width:200px;padding:0 20px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:15px;font-weight:500;opacity:{{ btnOpacity }};cursor:{{ btnCursor }}\" style-hover=\"border-color:#27a8e0\">Copy plain text<\u002Fbutton><span style=\"font-size:14px;color:rgba(255,255,255,.6)\">For the Gmail and Outlook phone apps<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ download }}\" disabled=\"{{ notReady }}\" style=\"height:46px;min-width:200px;padding:0 20px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:15px;font-weight:500;opacity:{{ btnOpacity }};cursor:{{ btnCursor }}\" style-hover=\"border-color:#27a8e0\">Download file<\u002Fbutton><span style=\"font-size:14px;color:rgba(255,255,255,.6)\">For Thunderbird<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ copyCode }}\" disabled=\"{{ notReady }}\" style=\"height:46px;min-width:200px;padding:0 20px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:15px;font-weight:500;opacity:{{ btnOpacity }};cursor:{{ btnCursor }}\" style-hover=\"border-color:#27a8e0\">Copy HTML code<\u002Fbutton><span style=\"font-size:14px;color:rgba(255,255,255,.6)\">For IT, or apps that ask for “HTML”<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <section style=\"display:flex;flex-direction:column;gap:24px;max-width:1120px\">\n    <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:999px;background:#27a8e0;color:#000;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">3<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:-.01em\">Which email do you use?<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px\">\n      <sc-for list=\"{{ apps }}\" as=\"a\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ a.pick }}\" style=\"min-height:76px;padding:14px 18px;text-align:left;background:{{ a.bg }};color:{{ a.fg }};border:1px solid {{ a.border }};border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:center\" style-hover=\"border-color:#27a8e0\">\n          <span style=\"font-size:18px;font-weight:700;letter-spacing:-.01em\">{{ a.label }}<\u002Fspan>\n          <span style=\"font-size:14px;opacity:.75\">{{ a.hint }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ guessed }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14px;color:rgba(255,255,255,.55)\">We picked one based on your computer. Choose another if it’s wrong.<\u002Fdiv><\u002Fsc-if>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:24px;max-width:1120px\">\n    <div style=\"display:flex;align-items:center;gap:14px\"><span style=\"width:36px;height:36px;border-radius:999px;background:#27a8e0;color:#000;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">4<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:-.01em\">Paste it into {{ appName }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:28px;max-width:760px\">\n      <sc-for list=\"{{ guide }}\" as=\"g\" hint-placeholder-count=\"1\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-if value=\"{{ g.title }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:19px;font-weight:700;color:#27a8e0\">{{ g.title }}<\u002Fdiv><\u002Fsc-if>\n          <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(255,255,255,.1)\">\n            <sc-for list=\"{{ g.steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <li style=\"display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)\">\n                <span style=\"flex:none;width:28px;font-size:17px;font-weight:700;color:#27a8e0\">{{ s.n }}<\u002Fspan>\n                <span style=\"font-size:18px;line-height:1.5;color:rgba(255,255,255,.9);text-wrap:pretty\"><sc-for list=\"{{ s.parts }}\" as=\"p\" hint-placeholder-count=\"1\"><sc-if value=\"{{ p.b }}\" hint-placeholder-val=\"{{ false }}\"><strong style=\"font-weight:700;color:#fff\">{{ p.t }}<\u002Fstrong><\u002Fsc-if><sc-if value=\"{{ p.plain }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ p.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n          <sc-if value=\"{{ g.tip }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:16px;line-height:1.5;color:rgba(255,255,255,.7);padding-left:46px;text-wrap:pretty\">{{ g.tip }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:18px;line-height:1.5;color:#fff;font-weight:500\">Last step: send an email to yourself and check that the signature looks right.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:20px;max-width:760px;border-top:1px solid rgba(255,255,255,.1);padding-top:40px\">\n    <h2 style=\"margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em\">It didn’t <span style=\"color:#27a8e0\">work?<\u002Fspan><\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:18px;font-weight:700\">The pictures are missing<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);text-wrap:pretty\">Your email app may be hiding images. Click <strong style=\"color:#fff\">Show images<\u002Fstrong> or <strong style=\"color:#fff\">Download pictures<\u002Fstrong> at the top of the email. The text works fine without them.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:18px;font-weight:700\">Nothing happened when I pasted<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);text-wrap:pretty\">Go back to Step 2, click <strong style=\"color:#fff\">Copy signature<\u002Fstrong> again, then paste straight away without copying anything else.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:18px;font-weight:700\">The font looks different<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);text-wrap:pretty\">That’s normal. Email apps show the signature in Arial or Helvetica.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:18px;font-weight:700\">I see my old signature too<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);text-wrap:pretty\">Delete the old one in the same settings screen, or make sure <strong style=\"color:#fff\">QiOn<\u002Fstrong> is chosen as the default.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:18px;font-weight:700\">Still stuck<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:rgba(255,255,255,.78);text-wrap:pretty\">Email a screenshot to <a href=\"mailto:luismiguel.p@qiontech.com?subject=Help%20with%20my%20QiOn%20signature\" style=\"color:#27a8e0;font-weight:700\">luismiguel.p@qiontech.com<\u002Fa> and say which email app you use.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;assetBase&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hosting&quot;}}\">\nclass Component extends DCLogic {\n  state = { name: '', role: '', team: '', email: '', office: 'No office line', customOffice: '', status: '', missing: [], showMore: false, app: null };\n  previewRef = React.createRef();\n  officeRef = React.createRef();\n  FILES = ['qion-logo.png', 'award-2025.png', 'award-2026.png', 'e1-partner.png', 'icon-linkedin.png', 'icon-instagram.png'];\n\n  APPS = [\n    { id: 'outlook-win', label: 'Outlook on Windows', hint: 'Has a File menu, top left' },\n    { id: 'outlook-new', label: 'Outlook in a browser', hint: 'or the new Outlook app' },\n    { id: 'outlook-mac', label: 'Outlook on Mac', hint: 'Outlook app on a Mac' },\n    { id: 'gmail', label: 'Gmail', hint: 'In a web browser' },\n    { id: 'apple', label: 'Apple Mail', hint: 'Mail app on a Mac' },\n    { id: 'iphone', label: 'iPhone or iPad', hint: 'The built-in Mail app' },\n    { id: 'other', label: 'Something else', hint: 'Phone apps, Thunderbird, others' }\n  ];\n  NAMES = { 'outlook-win': 'Outlook', 'outlook-new': 'Outlook', 'outlook-mac': 'Outlook', gmail: 'Gmail', apple: 'Apple Mail', iphone: 'your iPhone or iPad', other: 'your email app' };\n  GUIDES = {\n    'outlook-win': [{ steps: [\n      'Open **Outlook**.',\n      'Click **File**, top left. Then click **Options**.',\n      'Click **Mail** on the left. Then click the **Signatures…** button.',\n      'Click **New**. Type **QiOn** and click **OK**.',\n      'Click inside the big empty box. Press **Ctrl** and **V** together to paste.',\n      'On the right, set **New messages** to **QiOn**. Set **Replies/forwards** to **QiOn**.',\n      'Click **OK**. You’re done.'\n    ], tip: 'No File menu? You have the new Outlook. Choose “Outlook in a browser” above.' }],\n    'outlook-new': [{ steps: [\n      'Open **Outlook**.',\n      'Click the **gear icon** (Settings), top right.',\n      'Click **Account**. Then click **Signatures**.',\n      'Click **+ New signature**. Type **QiOn** as the name.',\n      'Click inside the box below. Press **Ctrl** and **V** together to paste (on a Mac: **Cmd** and **V**).',\n      'Click **Save**.',\n      'Under the default signature menus, choose **QiOn** for new messages and for replies. Click **Save** again.'\n    ] }],\n    'outlook-mac': [{ steps: [\n      'Open **Outlook**.',\n      'In the menu bar at the very top of the screen, click **Outlook**. Then click **Settings**.',\n      'Click **Signatures**.',\n      'Click the **+** button. Type **QiOn** as the name.',\n      'Click inside the box. Press **Cmd** and **V** together to paste.',\n      'Close the small window with the **red dot**, top left. It saves by itself.',\n      'Under **Default signatures**, choose **QiOn** for **New messages** and **Replies/forwards**.'\n    ] }],\n    gmail: [{ steps: [\n      'Open **Gmail** in your web browser.',\n      'Click the **gear icon**, top right. Then click **See all settings**.',\n      'Stay on the **General** tab. Scroll down until you see **Signature**.',\n      'Click **Create new**. Type **QiOn** and click **Create**.',\n      'Click inside the box. Press **Ctrl** and **V** together to paste (on a Mac: **Cmd** and **V**).',\n      'Under **Signature defaults**, choose **QiOn** in both menus.',\n      'Scroll to the very bottom of the page and click **Save Changes**.'\n    ], tip: 'Using the Gmail app on your phone? Choose “Something else” above.' }],\n    apple: [{ steps: [\n      'Open **Mail**.',\n      'In the menu bar at the very top of the screen, click **Mail**. Then click **Settings**.',\n      'Click **Signatures**.',\n      'On the left, click your QiOn email account. Then click **+** at the bottom.',\n      'Type **QiOn** as the name.',\n      'Untick **Always match my default message font**.',\n      'Click inside the box on the right. Delete the sample text. Press **Cmd** and **V** together to paste.',\n      'Close the window. You’re done.'\n    ] }],\n    iphone: [{ steps: [\n      'Open this page on your iPhone or iPad. Fill in your details and tap **Copy signature**.',\n      'Open the **Settings** app.',\n      'Tap **Apps**, then **Mail**, then **Signature**.',\n      'Delete the text in the box. Tap and hold inside the box, then tap **Paste**.',\n      'If it looks wrong, shake the phone gently and tap **Undo**.',\n      'Tap **Back**, top left, to save.'\n    ] }],\n    other: [\n      { title: 'Gmail or Outlook app on your phone', steps: [\n        'In Step 2, open **Other options** and tap **Copy plain text**.',\n        'Gmail app: tap **Menu** (three lines), **Settings**, your account, then **Mobile signature** (iPhone) or **Signature** (Android).',\n        'Outlook app: tap your picture, top left, then the **gear icon**, then **Signature**.',\n        'Paste and save.'\n      ], tip: 'Phone apps only show text, without logos. That’s expected.' },\n      { title: 'Thunderbird', steps: [\n        'In Step 2, open **Other options** and click **Download file**. Keep the file somewhere you won’t delete it.',\n        'In Thunderbird, open **Account Settings** and click your email address.',\n        'Tick **Attach the signature from a file instead**, then click **Choose…** and pick the file.',\n        'Close the settings.'\n      ] },\n      { title: 'Any other email app', steps: [\n        'Look for **Signature** in the app’s settings.',\n        'Paste with **Ctrl** and **V** (on a Mac: **Cmd** and **V**).',\n        'If the app asks for “HTML”, use **Copy HTML code** in Step 2’s **Other options** instead.'\n      ] }\n    ]\n  };\n\n  parse(str) { return str.split(/(\\*\\*[^*]+\\*\\*)/).filter(Boolean).map(t => t.startsWith('**') ? { t: t.slice(2, -2), b: true, plain: false } : { t, b: false, plain: true }); }\n  guessApp() {\n    const ua = navigator.userAgent || '';\n    if (/iPhone|iPad/.test(ua)) return 'iphone';\n    if (/Android/.test(ua)) return 'other';\n    if (/Mac/.test(ua)) return 'outlook-mac';\n    return 'outlook-win';\n  }\n  base() {\n    const b = (this.props.assetBase || '').trim();\n    if (b) return b.endsWith('/') ? b : b + '/';\n    const loc = /^https?:/.test(window.location.href) ? window.location.href : document.baseURI;\n    return new URL('signature-assets/', loc).href;\n  }\n  syncSelect() { const s = this.officeRef.current; if (s && s.value !== this.state.office) s.value = this.state.office; }\n  componentDidMount() { this.paint(); this.syncSelect(); this.checkAssets(); }\n  componentDidUpdate() { this.paint(); this.syncSelect(); }\n  checkAssets() {\n    const b = this.base(); const miss = []; let left = this.FILES.length;\n    this.FILES.forEach(f => {\n      const im = new Image();\n      const done = ok => { if (!ok) miss.push(f); if (--left === 0) this.setState({ missing: miss }); };\n      im.onload = () => done(true); im.onerror = () => done(false); im.src = b + f;\n    });\n  }\n  esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\n  vals() {\n    const s = this.state;\n    const office = s.office === 'Other…' ? s.customOffice.trim() : (s.office === 'No office line' ? '' : s.office);\n    return { name: s.name.trim() || 'Your Name', role: [s.role.trim() || 'Your position', s.team.trim()].filter(Boolean).join(' · '), email: s.email.trim() || 'name.surname@qiontech.com', office };\n  }\n  html() {\n    const v = this.vals(), e = x => this.esc(x), b = this.base();\n    const F = \"font-family:Aeonik,Helvetica,Arial,sans-serif;\";\n    const blue = '#27a8e0';\n    const sep = `<span style=\"color:${blue};\">&nbsp;//&nbsp;<\u002Fspan>`;\n    const officeHtml = v.office ? `${sep}<span style=\"color:#555555;\">${e(v.office)}<\u002Fspan>` : '';\n    const award = (src, w, h, txt) => `<tr><td style=\"padding:0 0 4px 0;${F}font-size:10px;line-height:18px;color:#666666;\"><img src=\"${b}${src}\" width=\"${w}\" height=\"${h}\" alt=\"\" style=\"display:inline-block;vertical-align:middle;border:0;height:${h}px;width:${w}px;\">&nbsp;&nbsp;<span style=\"vertical-align:middle;\">${txt}<\u002Fspan><\u002Ftd><\u002Ftr>`;\n    return `<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" role=\"presentation\" style=\"border-collapse:collapse;max-width:560px;${F}color:#000000;\">\n<tr>\n< iontech<\u002Fspan><\u002Fa><\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Ftd>\n<\u002Ftr>\n<tr><td colspan=\"3\" style=\"padding:16px 0 0 0;\"><table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" role=\"presentation\" width=\"100%\" style=\"border-collapse:collapse;border-top:1px solid #e5e5e5;\">\n<tr><td style=\"padding:10px 0 0 0;\"><table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" role=\"presentation\" style=\"border-collapse:collapse;\">\n${award('award-2025.png', 16, 18, 'Top EV Charging Solutions Provider 2025 — Energy Tech Review')}\n${award('award-2026.png', 16, 18, 'Battery Storage Company of the Year 2026 — Energy Tech Review')}\n${award('e1-partner.png', 62, 14, 'Official Charging Partner — UIM E1 World Championship')}\n<tr><td style=\"padding:4px 0 0 0;${F}font-size:10px;line-height:16px;color:#666666;\"><span style=\"letter-spacing:1.4px;text-transform:uppercase;\">COMPLIANT WITH<\u002Fspan>&nbsp;&nbsp;<b style=\"color:#444444;\">ISO 9001<\u002Fb>${sep}<b style=\"color:#444444;\">ISO 14001<\u002Fb>${sep}<b style=\"color:#444444;\">ISO 45001<\u002Fb><\u002Ftd><\u002Ftr>\n<\u002Ftable><\u002Ftd><\u002Ftr>\n<\u002Ftable><\u002Ftd><\u002Ftr>\n<\u002Ftable>`;\n  }\n  plain() {\n    const v = this.vals();\n    return [`${v.name} // ${v.role}`, v.email, 'qiontech.com' + (v.office ? ' // ' + v.office : ''), 'LinkedIn: linkedin.com/company/qiontech  |  Instagram: @qiontech', '', 'Top EV Charging Solutions Provider 2025 — Energy Tech Review', 'Battery Storage Company of the Year 2026 — Energy Tech Review', 'Official Charging Partner — UIM E1 World Championship', 'Compliant with ISO 9001 // ISO 14001 // ISO 45001'].join('\\n');\n  }\n  paint() { const el = this.previewRef.current; if (el) { const h = this.html(); if (el.__h !== h) { el.innerHTML = h; el.__h = h; } } }\n  flash(msg) { this.setState({ status: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ status: '' }), 8000); }\n  async copyRich() {\n    const html = this.html(), text = this.plain();\n    const okMsg = 'Copied. Now go to Step 3.';\n    try {\n      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);\n      return this.flash(okMsg);\n    } catch (e) {}\n    const el = this.previewRef.current, r = document.createRange();\n    r.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);\n    const ok = document.execCommand('copy'); sel.removeAllRanges();\n    this.flash(ok ? okMsg : 'Your browser blocked copying. Select the signature above with your mouse and press Ctrl+C (Cmd+C on a Mac).');\n  }\n  async copyText(t, msg) {\n    try { await navigator.clipboard.writeText(t); return this.flash(msg); } catch (e) {}\n    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();\n    const ok = document.execCommand('copy'); ta.remove(); this.flash(ok ? msg : 'Your browser blocked copying.');\n  }\n  download() {\n    const doc = `<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>QiOn signature<\u002Ftitle><\u002Fhead><body>${this.html()}<\u002Fbody><\u002Fhtml>`;\n    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));\n    a.download = 'qion-signature.htm'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n    this.flash('File downloaded: qion-signature.htm');\n  }\n  renderVals() {\n    const s = this.state, set = k => ev => this.setState({ [k]: ev.target.value });\n    const em = s.email.trim();\n    const ready = !!(s.name.trim() && s.role.trim() && em);\n    const app = s.app || this.guessApp();\n    let n = 0;\n    const guide = (this.GUIDES[app] || []).map(g => ({ title: g.title || '', tip: g.tip || '', steps: (n = 0, g.steps.map(st => ({ n: ++n, parts: this.parse(st) }))) }));\n    return {\n      name: s.name, role: s.role, team: s.team, email: s.email, office: s.office, customOffice: s.customOffice,\n      onName: set('name'), onRole: set('role'), onTeam: set('team'), onEmail: set('email'), onOffice: set('office'), onCustomOffice: set('customOffice'),\n      isCustomOffice: s.office === 'Other…',\n      emailWarn: em.length > 3 && !/@qiontech\\.com$/i.test(em),\n      notReady: !ready, btnOpacity: ready ? 1 : 0.32, btnCursor: ready ? 'pointer' : 'not-allowed',\n      previewRef: this.previewRef, officeRef: this.officeRef,\n      statusText: s.status || (!ready ? 'Fill in your name, position and email first.' : ''),\n      missingAssets: s.missing.length > 0, missingList: s.missing.join(', '),\n      showMore: s.showMore, moreIcon: s.showMore ? '−' : '+', toggleMore: () => this.setState({ showMore: !s.showMore }),\n      apps: this.APPS.map(a => ({ ...a, pick: () => this.setState({ app: a.id }), bg: a.id === app ? '#27a8e0' : '#0d0d0d', fg: a.id === app ? '#000' : '#fff', border: a.id === app ? '#27a8e0' : 'rgba(255,255,255,.22)' })),\n      guessed: !s.app, appName: this.NAMES[app], guide,\n      copyRich: () => this.copyRich(),\n      copyPlain: () => this.copyText(this.plain(), 'Plain text copied. Now paste it in your phone app.'),\n      copyCode: () => this.copyText(this.html(), 'HTML code copied.'),\n      download: () => this.download()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
